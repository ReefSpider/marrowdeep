<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marrowdeep — gameplay art review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#12171b;color:#dcd6c2;font:15px system-ui}header{position:sticky;top:0;background:#171e23ed;padding:20px 28px;border-bottom:1px solid #574d3c;z-index:1}h1{font:24px Georgia;margin:0 0 6px;color:#d7b77c}p{color:#a7afa8;margin:6px 0 16px}label{display:inline-flex;gap:7px;align-items:center;margin:4px 14px 4px 0}select,input{background:#283038;color:#eee4cc;border:1px solid #66604e;border-radius:4px;padding:6px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;padding:24px}canvas{background:#22272b;width:100%;image-rendering:pixelated;border:1px solid #343d41;border-radius:3px}iframe{position:absolute;width:960px;height:540px;visibility:hidden;pointer-events:none}small{color:#a6ad9c}#status{color:#c5ab78}</style>
<header><h1>Marrowdeep / Gameplay art workshop</h1><p>Inspect the actual game drawings. Chunky contours, richer materials, restrained elemental accents.</p>
<label>Collection <select id="category"><option value="gear">Weapons & equipment</option><option value="mobs">All creatures</option><option value="bosses">Bosses</option><option value="effects">Damage effects</option></select></label>
<label>Find <input id="find" placeholder="Name or type"></label>
<label>Element <select id="element"><option value="">None</option></select></label>
<label>Rarity <select id="rarity"><option value="0">Normal</option><option value="1">Magic</option><option value="2">Rare</option><option value="3">Legendary</option><option value="4">Unique</option><option value="5">Abyssal</option></select></label>
<label>Pose <select id="state"><option>chase</option><option>idle</option><option>wind</option><option>lunge</option><option>pounce</option><option>cast</option><option>perch</option><option>buried</option><option>sunk</option><option>hide</option></select></label>
<label>Boss phase <select id="phase"><option>1</option><option>2</option><option>3</option></select></label>
<label><input id="animate" type="checkbox" checked>Animate</label><label><input id="active" type="checkbox">Boss attack</label><label><input id="kesh" type="checkbox">Kesh variants</label><small id="status">Loading game…</small></header>
<main id="grid"></main><iframe id="engine" src="../index.html?artreview=1" title="Game art renderer"></iframe>
<script>
const $=id=>document.getElementById(id),engine=$('engine');let bridge=null,cards=[],last=0;
engine.onload=()=>{try{const s=engine.contentDocument.createElement('script');s.src='tools/art-review-bridge.js';s.onload=()=>{bridge=engine.contentWindow.ART_REVIEW;for(const k of bridge.list('effects'))$('element').add(new Option(k,k));rebuild();};s.onerror=()=>{$('status').textContent='Could not load the review bridge.'};engine.contentDocument.body.appendChild(s);}catch(e){$('status').textContent='Serve the repository over HTTP, then open /tools/art-review.html.';}};
function rebuild(){if(!bridge)return;const cat=$('category').value,find=$('find').value.toLowerCase();$('grid').replaceChildren();cards=bridge.list(cat).filter(n=>n.toLowerCase().includes(find)).map(name=>{const canvas=document.createElement('canvas');canvas.width=360;canvas.height=cat==='bosses'?410:250;$('grid').append(canvas);return {name,canvas};});$('status').textContent=cards.length+' assets';paint(0);}
function paint(t){if(!bridge)return;const category=$('category').value;for(const {name,canvas}of cards){try{bridge.paint(canvas,category,name,{time:t,zoom:category==='bosses'?2.7:3,rarity:+$('rarity').value,element:$('element').value,state:$('state').value,phase:+$('phase').value,active:$('active').checked,kesh:$('kesh').checked});}catch(e){$('status').textContent=name+': '+e.message;}}}
for(const id of ['category','find'])$(id).addEventListener('input',rebuild);for(const id of ['rarity','element','state','phase','active','kesh','animate'])$(id).addEventListener('input',()=>paint(performance.now()/1000));
function loop(t){if(t-last>125&&$('animate').checked){last=t;paint(t/1000);}requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></html>
